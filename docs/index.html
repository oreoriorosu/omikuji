<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>詩片のおみくじ</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; background: #ebe8e2; }
  main { display: flex; justify-content: center; padding: 24px 16px 40px; }
  img {
    display: block;
    width: min(100%, 440px);
    height: auto;
    aspect-ratio: 882 / 3087;
    background: #fff;
    box-shadow: 0 2px 12px rgba(0, 0, 0, .15);
    opacity: 0;
    transform: translateY(-12px);
    transition: opacity .8s ease, transform .8s ease;
  }
  img.shown { opacity: 1; transform: none; }
</style>
</head>
<body>
<main><img id="kuji" alt="おみくじ"></main>
<script>
  const COUNT = 80;
  const n = Math.floor(Math.random() * COUNT) + 1;
  const img = document.getElementById('kuji');
  img.onload = () => img.classList.add('shown');
  img.src = 'img/' + String(n).padStart(2, '0') + '.webp';
</script>
</body>
</html>
