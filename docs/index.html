<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>詩片のおみくじ</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; background: #ebe8e2; }
  main { display: flex; flex-direction: column; align-items: center; padding: 24px 16px 40px; }
  #kuji {
    display: block; width: min(100%, 440px); height: auto; aspect-ratio: 882 / 3087;
    background: #fff; box-shadow: 0 2px 12px rgba(0, 0, 0, .15);
  }

  /* 表紙: img/cover.webp（短冊上部を縦書きが読める向きに回したもの 756x882）を
     タイトル側（右 x>=360）と注意書き側（左 x<360）の2枚に分け、注意書きを左へ開く */
  #cover {
    position: fixed; inset: 0; z-index: 1;
    display: flex; align-items: center; justify-content: center; padding: 16px;
    background: #ebe8e2;
    opacity: 0; transition: opacity .6s ease;
  }
  .fold {
    position: relative; width: min(100%, 400px); aspect-ratio: 756 / 882;
    perspective: 1400px; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, .15));
    transform: translateX(-23.81%); /* 閉じている間はタイトルを中央に */
    transition: transform 1.1s ease;
  }
  .leaf {
    position: absolute; top: 0; height: 100%;
    background: #fff url(img/cover.webp) no-repeat; background-size: auto 100%;
  }
  .title { right: 0; width: 52.381%; background-position: right top; }
  .note {
    left: 0; width: calc(47.619% + 1px); background-position: left top;
    transform-origin: right center; transform: rotateY(-90deg);
    transition: transform 1.1s ease;
  }
  body.cover #cover { opacity: 1; }
  body.unfold .fold, body.unfold .note { transform: none; }
  body.open #cover { opacity: 0; pointer-events: none; transition-duration: .7s; }

  #kuji, #save { opacity: 0; transition: opacity .9s ease .3s; }
  body.open #kuji, body.open #save { opacity: 1; }

  #save {
    margin-top: 24px; padding: 10px 32px;
    font: 15px "Hiragino Mincho ProN", "Yu Mincho", serif; letter-spacing: .1em;
    color: #222; background: #fff; border: 1px solid #555; border-radius: 999px;
  }
</style>
</head>
<body>
<div id="cover"><div class="fold"><div class="leaf note"></div><div class="leaf title"></div></div></div>
<main>
  <img id="kuji" alt="おみくじ">
  <button id="save" type="button">画像を保存</button>
</main>
<script>
  const COUNT = 80;
  const T_UNFOLD = 1500; // タイトル表示から注意書きを開くまで(ms)
  const T_OPEN = 5000;   // 短冊全体へ切り替えるまで(ms)
  const n = String(Math.floor(Math.random() * COUNT) + 1).padStart(2, '0');
  const slip = document.getElementById('kuji');
  const save = document.getElementById('save');
  const cover = new Image();
  let file;

  cover.src = 'img/cover.webp';
  slip.src = `img/${n}.webp`;
  Promise.all([slip.decode(), cover.decode()]).then(() => {
    const cl = document.body.classList;
    cl.add('cover');
    setTimeout(() => cl.add('unfold'), T_UNFOLD);
    setTimeout(() => cl.add('open'), T_OPEN);
    // iOSの共有シートはクリック直後に呼ぶ必要があるため、保存用PNGは先に作っておく
    const c = document.createElement('canvas');
    c.width = slip.naturalWidth;
    c.height = slip.naturalHeight;
    c.getContext('2d').drawImage(slip, 0, 0);
    c.toBlob(b => { file = new File([b], `omikuji-${n}.png`, { type: 'image/png' }); }, 'image/png');
  }, () => document.body.classList.add('open'));

  // iOSはダウンロードだと「ファイル」行きになるため、共有シート（「画像を保存」で写真へ）を使う
  const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  save.onclick = async () => {
    if (!file) return;
    if (isIOS && navigator.canShare?.({ files: [file] })) {
      try { await navigator.share({ files: [file] }); } catch (e) {}
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file);
    a.download = file.name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
</script>
</body>
</html>
